<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>

    <!--Meta-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Title-->
    <title>Best Duo | Draft Predict</title>

    <!--    CSS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/ranked-soloq/stats-pages/detail-page.css">
    <link rel="stylesheet" href="/CSS/ranked-soloq/ranked-soloq.css">
    <link rel="stylesheet" href="/CSS/ranked-soloq/stats-pages/best-duo.css">

    <!--    Logo-->
    <link rel="icon" href="/IMG/logo/riot-logo.png">

    <!--    Script-->
    <script src="/JS/ranked-soloq/best-duo.js" defer></script>

</head>
<body>
<div class="bg-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="page-wrapper">
    <header class="site-header">
        <a th:href="@{/ranked-soloq/main}" class="logo" aria-label="Go to homepage">
            <div class="logo-mark">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 2L4 9v14l12 7 12-7V9L16 2z" stroke="currentColor" stroke-width="2"
                          stroke-linejoin="round"/>
                    <path d="M16 11v10M11 13.5l5-2.5 5 2.5M11 18.5l5 2.5 5-2.5" stroke="currentColor" stroke-width="1.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="logo-text">Draft Predict</span>
        </a>
    </header>

    <main class="stats-main">
        <section class="stats-card">
            <div class="card-header">
                <div class="card-icon duo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                </div>
                <div class="card-title-group">
                    <h2 class="card-title">Best Duo</h2>
                    <p class="card-subtitle">Best Duo synergies</p>
                </div>
            </div>

            <div class="role-filter">
                <label for="championSelect">Champion</label>
                <select id="championSelect" class="champion-select">
                    <option value="" disabled selected>Select champion</option>
                    <option th:each="c : ${championList}" th:value="${c.champion}" th:text="${c.champion}"></option>
                </select>

                <div class="role-divider">|</div>

                <label for="role1">Role 1</label>
                <select id="role1" class="role-select">
                    <option value="TOP">TOP</option>
                    <option value="JUNGLE">JUNGLE</option>
                    <option value="MIDDLE" selected>MIDDLE</option>
                    <option value="BOTTOM">BOTTOM</option>
                    <option value="UTILITY">UTILITY</option>
                </select>

                <label for="role2">Role 2</label>
                <select id="role2" class="role-select">
                    <option value="TOP">TOP</option>
                    <option value="JUNGLE" selected>JUNGLE</option>
                    <option value="MIDDLE">MIDDLE</option>
                    <option value="BOTTOM">BOTTOM</option>
                    <option value="UTILITY">UTILITY</option>
                </select>

                <div class="role-divider">|</div>

                <label for="patchSelect">Patch</label>
                <select id="patchSelect" class="patch-select">
                    <option th:each="p : ${patchList}" th:value="${p}" th:text="${p}"
                            th:selected="${p == 'All patches'}"></option>
                </select>

                <button id="searchBtn" class="search-btn" type="button">Search</button>
            </div>

            <table class="stats-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Champion 1</th>
                    <th>Champion 2</th>
                    <th>Pick Rate</th>
                    <th>Win Rate</th>
                </tr>
                </thead>
                <tbody id="duoTableBody">
                <tr th:each="duo, iterStat : ${bestDuoChampions}" th:style="'animation-delay: ' + ${iterStat.index * 0.06} + 's'">
                    <td class="col-rank" th:text="${iterStat.index + 1}">1</td>
                    <td class="col-champ">
                        <div class="champ-cell">
                            <div class="champ-avatar">
                                <img th:src="@{'/IMG/champions/logo/' + ${duo.champion1} + '.png'}"
                                     th:alt="${duo.champion1}" />
                            </div>
                            <span class="champ-name" th:text="${duo.champion1}">Champion 1</span>
                        </div>
                    </td>
                    <td class="col-champ">
                        <div class="champ-cell">
                            <div class="champ-avatar">
                                <img th:src="@{'/IMG/champions/logo/' + ${duo.champion2} + '.png'}"
                                     th:alt="${duo.champion2}" />
                            </div>
                            <span class="champ-name" th:text="${duo.champion2}">Champion 2</span>
                        </div>
                    </td>
                    <td class="col-rate">
                        <span class="rate-badge pick" th:text="${#numbers.formatDecimal(duo.pickRate, 1, 1)} + '%'">0.0%</span>
                    </td>
                    <td class="col-rate">
                        <span class="rate-badge win" th:text="${#numbers.formatDecimal(duo.winRate, 1, 1)} + '%'">0.0%</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-line"></div>
        <p class="footer-text">
            Statistics collected from <span class="games-count" th:text="${amountOfMatches}">0</span> ranked games
        </p>
        <p class="footer-meta">
            Patch <span th:text="${actualPatch}">none</span>
            • Servers (<span th:text="${servers}">EUW, EUNE, KR, NA</span>)
            • Updated <span th:text="${timeUpdated}">none</span>
            • Ranks (<span th:text="${tiers}">Master, Grandmaster, Challenger</span>)
        </p>
    </footer>
</div>
</body>
</html>
