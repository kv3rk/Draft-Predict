<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>

    <!--    Meta-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--    Title-->
    <title>Draft Presence | Draft Predict</title>

    <!--    CSS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/ranked-soloq/stats-pages/detail-page.css">
    <link rel="stylesheet" href="/CSS/ranked-soloq/stats-pages/draft-presence.css">

    <!--    Logo-->
    <link rel="icon" href="/IMG/logo/riot-logo.png">

    <!--    Script-->
    <script src="/JS/ranked-soloq/draft-presence.js" defer></script>

</head>
<body>
<div class="bg-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="page-wrapper">
    <header class="site-header">
        <a th:href="@{/ranked-soloq/main}" class="logo" aria-label="Go to homepage">
            <div class="logo-mark">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 2L4 9v14l12 7 12-7V9L16 2z" stroke="currentColor" stroke-width="2"
                          stroke-linejoin="round"/>
                    <path d="M16 11v10M11 13.5l5-2.5 5 2.5M11 18.5l5 2.5 5-2.5" stroke="currentColor" stroke-width="1.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="logo-text">Draft Predict</span>
        </a>
    </header>

    <main class="dashboard detail-dashboard">
        <section class="stats-card detail-card" id="draftPresenceCard">
            <div class="card-header">
                <div class="card-icon presence-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                </div>
                <div class="card-title-group">
                    <h2 class="card-title">Draft Presence</h2>
                    <p class="card-subtitle" th:text="'Presence for ' + ${championDraftPresence.champion}">Presence for
                        Aatrox</p>
                </div>
            </div>

            <div class="champion-filter">
                <label for="championSelect">Champion</label>
                <select id="championSelect" class="champion-select">
                    <option th:each="c : ${championList}" th:value="${c.champion}" th:text="${c.champion}"
                            th:selected="${c.champion == 'Aatrox'}"></option>
                </select>

                <span class="filter-divider">|</span>
                <label for="patchSelect">Patch</label>
                <select id="patchSelect" class="patch-select">
                    <option th:each="p : ${patchList}" th:value="${p}" th:text="${p}"
                            th:selected="${p == 'All patches'}"></option>
                </select>

                <button id="searchBtn" class="search-btn" type="button">Search</button>
            </div>

            <div class="presence-display" id="presenceDisplay">
                <div class="presence-value-wrapper"
                     th:with="presenceVal=${championDraftPresence != null && championDraftPresence.presence != null ? championDraftPresence.presence.orElse(null) : null}"
                     th:if="${presenceVal != null}">
                    <div class="presence-ring">
                        <svg class="presence-ring-svg" viewBox="0 0 120 120">
                            <circle class="presence-ring-bg" cx="60" cy="60" r="54"/>
                            <circle class="presence-ring-progress" cx="60" cy="60" r="54"
                                    th:stroke-dasharray="${presenceVal * 3.39} + ' 339.292'"
                                    th:style="'stroke-dashoffset: 0; --target-progress: ' + ${presenceVal}"/>
                        </svg>
                        <div class="presence-number">
                            <span class="presence-percent"
                                  th:text="${#numbers.formatDecimal(presenceVal, 1, 1)}">0.0</span>
                            <span class="presence-symbol">%</span>
                        </div>
                    </div>
                    <div class="presence-label">Draft presence rate</div>
                </div>

                <div class="presence-empty"
                     th:with="presenceVal=${championDraftPresence != null && championDraftPresence.presence != null ? championDraftPresence.presence.orElse(null) : null}"
                     th:if="${presenceVal == null}">
                    <p>No presence data found for this champion.</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-line"></div>
            <p class="footer-text">
                Statistics collected from
                <span class="games-count" id="totalGames" th:text="${amountOfMatches}">none</span>
                ranked games
            </p>
            <p class="footer-meta">
                Patch <span th:text="${actualPatch}">none</span>
                • Servers (<span th:text="${servers}">EUW, EUNE, KR, NA</span>)
                • Updated <span th:text="${timeUpdated}">none</span>
                • Ranks (<span th:text="${tiers}">Master, Grandmaster, Challenger</span>)
            </p>
        </div>
    </footer>
</div>
</body>
</html>
