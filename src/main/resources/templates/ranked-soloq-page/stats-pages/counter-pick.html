<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>

    <!--    Meta-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--    Title-->
    <title>Counter Pick | Draft Predict</title>

    <!--    CSS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/ranked-soloq/stats-pages/detail-page.css">
    <link rel="stylesheet" href="/CSS/ranked-soloq/stats-pages/counter-pick.css">

    <!--    Logo-->
    <link rel="icon" href="/IMG/logo/riot-logo.png">

    <!--    Script-->
    <script src="/JS/ranked-soloq/counter-pick.js" defer></script>

</head>
<body>
<div class="bg-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="page-wrapper">
    <header class="site-header">
        <a th:href="@{/ranked-soloq/main}" class="logo" aria-label="Go to homepage">
            <div class="logo-mark">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 2L4 9v14l12 7 12-7V9L16 2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M16 11v10M11 13.5l5-2.5 5 2.5M11 18.5l5 2.5 5-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="logo-text">Draft Predict</span>
        </a>
    </header>

    <main class="dashboard detail-dashboard">
        <section class="stats-card detail-card" id="counterPickCard">
            <div class="card-header">
                <div class="card-icon counter-pick-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5"/>
                        <path d="M13 19l6-6"/>
                        <path d="M16 16l4 4"/>
                        <path d="M19 21l2-2"/>
                    </svg>
                </div>
                <div class="card-title-group">
                    <h2 class="card-title">Counter Pick</h2>
                    <p class="card-subtitle">Best counters for selected champion</p>
                </div>
            </div>

            <div class="counter-pick-filter">
                <div class="filter-group">
                    <label for="championSelect">Champion</label>
                    <select id="championSelect" class="champion-select">
                        <option th:each="c : ${championList}" th:value="${c.champion}" th:text="${c.champion}" th:selected="${c.champion == 'Aatrox'}"></option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="laneSelect">Lane</label>
                    <select id="laneSelect" class="lane-select">
                        <option value="TOP">Top</option>
                        <option value="JUNGLE">Jungle</option>
                        <option value="MIDDLE" selected>Middle</option>
                        <option value="BOTTOM">Bottom</option>
                        <option value="UTILITY">Utility</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="patchSelect">Patch</label>
                    <select id="patchSelect" class="patch-select">
                        <option th:each="p : ${patchList}" th:value="${p}" th:text="${p}" th:selected="${p == 'All patches'}"></option>
                    </select>
                </div>

                <button id="searchBtn" class="search-btn" type="button">Search</button>
            </div>

            <div class="table-wrapper">
                <table class="stats-table">
                    <thead>
                    <tr>
                        <th class="col-rank">#</th>
                        <th class="col-champ">Counter Champion</th>
                        <th class="col-rate">Gold Diff</th>
                        <th class="col-rate">XP Diff</th>
                        <th class="col-rate">Farm Diff</th>
                    </tr>
                    </thead>
                    <tbody id="counterTableBody">
                    <tr th:each="counter, iter : ${championCounterPick}">
                        <td class="col-rank" th:text="${iter.count}">1</td>
                        <td class="col-champ">
                            <div class="champ-cell">
                                <div class="champ-avatar" th:text="${#strings.substring(counter.champion2, 0, 1)}">A</div>
                                <span class="champ-name" th:text="${counter.champion2}">Ahri</span>
                            </div>
                        </td>
                        <td class="col-rate">
                            <span class="rate-badge gold" th:classappend="${counter.gold >= 0} ? 'positive' : 'negative'" th:text="${#numbers.formatDecimal(counter.gold, 1, 1)}">+245</span>
                        </td>
                        <td class="col-rate">
                            <span class="rate-badge xp" th:classappend="${counter.xp >= 0} ? 'positive' : 'negative'" th:text="${#numbers.formatDecimal(counter.xp, 1, 1)}">+12.5</span>
                        </td>
                        <td class="col-rate">
                            <span class="rate-badge farm" th:classappend="${counter.farm >= 0} ? 'positive' : 'negative'" th:text="${#numbers.formatDecimal(counter.farm, 1, 1)}">+8.3</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-line"></div>
            <p class="footer-text">
                Statistics collected from
                <span class="games-count" id="totalGames" th:text="${amountOfMatches}">none</span>
                ranked games
            </p>
            <p class="footer-meta">
                Patch <span th:text="${actualPatch}">none</span>
                • Servers (<span th:text="${servers}">EUW, EUNE, KR, NA</span>)
                • Updated <span th:text="${timeUpdated}">none</span>
                • Ranks (<span th:text="${tiers}">Master, Grandmaster, Challenger</span>)
            </p>
        </div>
    </footer>
</div>
</body>
</html>
