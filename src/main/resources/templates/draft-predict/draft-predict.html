<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>

    <!--    Meta-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--    Title-->
    <title>Draft Predict</title>

    <!--    CSS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/draft-predict/draft-predict.css">
    <link rel="stylesheet" href="/CSS/draft-predict/general-match-info.css">
    <link rel="stylesheet" href="/CSS/draft-predict/draft-phase.css">
    <link rel="stylesheet" href="/CSS/draft-predict/ban-recommendation.css">
    <link rel="stylesheet" href="/CSS/draft-predict/pick-recommendation.css">

    <!--    Logo-->
    <link rel="icon" href="/IMG/logo/riot-logo.png">

    <!--    Script-->
    <script src="/JS/draft-predict/general-match-info.js" defer></script>
    <script src="/JS/draft-predict/locking-system.js" defer></script>
    <script src="/JS/draft-predict/banned-champions.js" defer></script>
    <script src="/JS/draft-predict/picked-champions.js" defer></script>
    <script src="/JS/draft-predict/draft-types/ranked-legacy-draft-predict.js" defer></script>
    <script src="/JS/draft-predict/draft-phase.js" defer></script>

</head>

<body>
<div class="bg-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="page-wrapper">
    <header class="site-header">
        <a th:href="@{/lol/main}" class="logo" aria-label="Go to homepage">
            <div class="logo-mark">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 2L4 9v14l12 7 12-7V9L16 2z" stroke="currentColor" stroke-width="2"
                          stroke-linejoin="round"/>
                    <path d="M16 11v10M11 13.5l5-2.5 5 2.5M11 18.5l5 2.5 5-2.5" stroke="currentColor" stroke-width="1.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="logo-text">Draft Predict</span>
        </a>
    </header>

    <main class="draft-main">
        <!-- Upper Block: Match Setup -->
        <section class="stats-card match-setup-card" id="matchSetupCard">
            <div class="card-header">
                <div class="card-icon setup-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v6m0 6v6m4.22-10.22l4.24-4.24M6.34 6.34L2.1 2.1m17.8 17.8l-4.24-4.24M6.34 17.66l-4.24 4.24M23 12h-6m-6 0H1m20.07-4.93l-4.24 4.24M6.34 6.34l-4.24-4.24"/>
                    </svg>
                </div>
                <div class="card-title-group">
                    <h2 class="card-title">Match Setup</h2>
                    <p class="card-subtitle">Configure draft parameters</p>
                </div>
            </div>

            <div class="setup-form">

                <div class="setup-field">
                    <label for="seasonSelect">Season</label>
                    <select id="seasonSelect" class="setup-select">
                        <option th:each="season : ${seasonList}" th:value="${season}" th:text="${season}"></option>
                    </select>
                </div>

                <div class="setup-field">
                    <label for="patchSelect">Patch</label>
                    <select id="patchSelect" class="setup-select">
                        <option th:each="patch : ${patchList}" th:value="${patch}" th:text="${patch}"></option>
                    </select>
                </div>

                <div class="setup-field">
                    <label for="draftTypeSelect">Draft Type</label>
                    <select id="draftTypeSelect" class="setup-select">
                        <option value="LEGACY">5v5 Legacy Draft</option>
                    </select>
                </div>

                <div class="setup-field">
                    <label for="firstPickSelect">First Pick</label>
                    <select id="firstPickSelect" class="setup-select">
                        <option value="BLUE">Blue Side</option>
                        <option value="RED">Red Side</option>
                    </select>
                </div>

                <button id="applyBtn" class="search-btn apply-btn" type="button">Apply</button>
            </div>
        </section>

        <!-- Bottom Block: Draft Phase (locked by default) -->
        <section class="draft-phase-wrapper" id="draftPhaseWrapper">
            <div class="lock-overlay" id="lockOverlay">
                <div class="lock-content">
                    <div class="lock-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>
                    </div>
                    <p class="lock-text">Configure match setup to unlock</p>
                </div>
            </div>

            <div class="stats-card draft-phase-card" id="draftPhaseCard">
                <div class="card-header">
                    <div class="card-icon draft-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 12l2 2 4-4"/>
                            <circle cx="12" cy="12" r="10"/>
                        </svg>
                    </div>
                    <div class="card-title-group">
                        <h2 class="card-title">Draft Phase</h2>
                        <p class="card-subtitle">Select bans and picks</p>
                    </div>
                </div>

                <!-- Draft Interface -->
                <div class="draft-interface" id="draftInterface">
                    <!-- Bans Row -->
                    <div class="bans-row">
                        <div class="bans-group blue-bans">
                            <div class="ban-slot" data-ban="blue-1"></div>
                            <div class="ban-slot" data-ban="blue-2"></div>
                            <div class="ban-slot" data-ban="blue-3"></div>
                            <div class="ban-slot" data-ban="blue-4"></div>
                            <div class="ban-slot" data-ban="blue-5"></div>
                        </div>
                        <div class="bans-divider">BANS</div>
                        <div class="bans-group red-bans">
                            <div class="ban-slot" data-ban="red-1"></div>
                            <div class="ban-slot" data-ban="red-2"></div>
                            <div class="ban-slot" data-ban="red-3"></div>
                            <div class="ban-slot" data-ban="red-4"></div>
                            <div class="ban-slot" data-ban="red-5"></div>
                        </div>
                    </div>

                    <!-- Picks Row -->
                    <div class="picks-row">
                        <!-- Blue Side Picks -->
                        <div class="picks-column blue-picks">
                            <div class="pick-slot" data-pick="blue-1">
                                <span class="pick-number">1</span>
                            </div>
                            <div class="pick-slot" data-pick="blue-2">
                                <span class="pick-number">2</span>
                            </div>
                            <div class="pick-slot" data-pick="blue-3">
                                <span class="pick-number">3</span>
                            </div>
                            <div class="pick-slot" data-pick="blue-4">
                                <span class="pick-number">4</span>
                            </div>
                            <div class="pick-slot" data-pick="blue-5">
                                <span class="pick-number">5</span>
                            </div>
                        </div>

                        <!-- Center Info -->
                        <div class="draft-center">

                            <div class="champion-select-wrapper" id="championSelectWrapper">
                                <select id="championSelect" class="champion-select">
                                    <option value="" disabled selected>Select champion</option>
                                    <option th:each="c : ${championList}" th:value="${c.champion}"
                                            th:text="${c.champion}"></option>
                                </select>
                            </div>

                            <div class="ban-recommendations" id="banRecommendations"></div>

                            <div class="pick-recommendations" id="pickRecommendations"></div>

<!--                            <div class="draft-patch" id="draftPatch">Patch 14.10</div>-->

<!--                            <div class="draft-vs">VS</div>-->

<!--                            <div class="draft-first-pick" id="draftFirstPick">First Pick: Blue</div>-->

                        </div>

                        <!-- Red Side Picks -->
                        <div class="picks-column red-picks">
                            <div class="pick-slot" data-pick="red-1">
                                <span class="pick-number">1</span>
                            </div>
                            <div class="pick-slot" data-pick="red-2">
                                <span class="pick-number">2</span>
                            </div>
                            <div class="pick-slot" data-pick="red-3">
                                <span class="pick-number">3</span>
                            </div>
                            <div class="pick-slot" data-pick="red-4">
                                <span class="pick-number">4</span>
                            </div>
                            <div class="pick-slot" data-pick="red-5">
                                <span class="pick-number">5</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Champion Grid (clickable champion tiles) -->
                <div class="champion-grid" id="championGrid">
                    <div th:each="champion : ${championList}"
                         class="champion-grid-item"
                         th:data-champion="${champion.champion}">
                        <img class="champion-grid-img"
                             alt="Champion"
                             th:data-champion-name="${champion.champion}" />
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
