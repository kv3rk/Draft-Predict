<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>

    <!--    Meta-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--    Title-->
    <title>Ban Rates | Draft Predict</title>

    <!--    CSS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/stats-pages/detail-page.css">

    <!--    Logo-->
    <link rel="icon" href="/IMG/logo/riot-logo.png">

    <!--    JS-->
    <script src="/JS/stats-pages/ban-rates.js" defer></script>

</head>
<body>
<div class="bg-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="page-wrapper">
    <header class="site-header">
        <a th:href="@{/draft-predict/main}" class="logo" aria-label="Go to homepage">
            <div class="logo-mark">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 2L4 9v14l12 7 12-7V9L16 2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M16 11v10M11 13.5l5-2.5 5 2.5M11 18.5l5 2.5 5-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="logo-text">Draft Predict</span>
        </a>
    </header>

    <main class="dashboard detail-dashboard">
        <section class="stats-card detail-card" id="banCard">
            <div class="card-header">
                <div class="card-icon ban-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
                    </svg>
                </div>
                <div class="card-title-group">
                    <h2 class="card-title">Ban Rates</h2>
                    <p class="card-subtitle">Most banned champions</p>
                </div>
            </div>

            <!-- Patch Filter -->
            <div class="patch-filter">
                <div class="filter-group">
                    <label for="patchSelect">Patch</label>
                    <select id="patchSelect" class="patch-select">
                        <option value="" disabled>Loading patches...</option>
                    </select>
                </div>
                <button id="searchBtn" class="search-btn" type="button">Search</button>
            </div>

            <div class="table-wrapper">
                <table class="stats-table">
                    <thead>
                    <tr>
                        <th class="col-rank">#</th>
                        <th class="col-champ">Champion</th>
                        <th class="col-rate">Ban Rate</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="champ, iter : ${mostBannedChampions}">
                        <td class="col-rank" th:text="${iter.count}">1</td>
                        <td class="col-champ">
                            <div class="champ-cell">
                                <div class="champ-avatar" th:text="${#strings.substring(champ.champion, 0, 1)}">Y</div>
                                <span class="champ-name" th:text="${champ.champion}">Yasuo</span>
                            </div>
                        </td>
                        <td class="col-rate">
                            <span class="rate-badge ban" th:text="${#numbers.formatDecimal(champ.banRate, 1, 1)} + '%'">38%</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-line"></div>
            <p class="footer-text">
                Statistics collected from
                <span class="games-count" id="totalGames" th:text="${amountOfMatches}">none</span>
                ranked games
            </p>
            <p class="footer-meta">
                Patch <span th:text="${actualPatch}">none</span>
                • Servers (<span th:text="${servers}">EUW, EUNE, KR, NA</span>)
                • Updated <span th:text="${timeUpdated}">none</span>
                • Ranks (<span th:text="${tiers}">Master, Grandmaster, Challenger</span>)
            </p>
        </div>
    </footer>
</div>
</body>
</html>
