<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <!--    Meta-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Draft Predict — Find Summoner</title>

    <!--    Image-->
    <link rel="icon" type="image/x-icon" href="/IMG/logo/riot-logo.png">

    <!--    CSS-->
    <link rel="stylesheet" href="/CSS/search-page/search-page.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<div class="bg-glow"></div>

<main class="container">
    <div class="search-card">
        <div class="logo-area">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                    <path d="M11 8v6M8 11h6" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="title">Draft Predict</h1>
            <p class="subtitle">Enter summoner details to analyze match history</p>
        </div>

        <form th:action="@{/draft-predict/find/summoner}" th:object="${FundSummonerDTO}" method="POST"
              class="search-form" id="searchForm">
            <div class="input-group">
                <label for="name">Summoner Name</label>
                <input
                        type="text"
                        id="name"
                        th:field="*{name}"
                        placeholder="Hide on bush"
                        required
                        autocomplete="off"
                        maxlength="16"
                >
            </div>

            <div class="input-group">
                <label for="tagLine">Tagline</label>
                <input
                        type="text"
                        id="tagLine"
                        th:field="*{tagLine}"
                        placeholder="KR1"
                        required
                        autocomplete="off"
                        maxlength="5"
                >
                <span class="hint">Example: KR1, EUW, NA1</span>
            </div>

            <button type="submit" class="search-btn">
                <span>Search</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
            </button>
        </form>
    </div>

</main>
</body>
</html>
