<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>

    <!--    Meta-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--    Title-->
    <title>Draft Predict</title>

    <!--    CSS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/CSS/main-page.css">
    <link rel="stylesheet" href="/CSS/common.css">

    <!--    Logo-->
    <link rel="icon" href="/IMG/logo/riot-logo.png">

</head>
<body>
<div class="bg-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="page-wrapper">
    <header class="site-header">
        <a th:href="@{/lol/main}" class="logo" aria-label="Go to homepage">
            <div class="logo-mark">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 2L4 9v14l12 7 12-7V9L16 2z" stroke="currentColor" stroke-width="2"
                          stroke-linejoin="round"/>
                    <path d="M16 11v10M11 13.5l5-2.5 5 2.5M11 18.5l5 2.5 5-2.5" stroke="currentColor" stroke-width="1.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="logo-text">Draft Predict</span>
        </a>
    </header>

    <main class="dashboard">
        <div class="main-grid">
            <a th:href="@{/ranked-soloq/main}" class="card-link main-card-link">
                <section class="stats-card main-card" id="rankedCard">
                    <div class="card-header">
                        <div class="card-icon ranked-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                        </div>
                        <div class="card-title-group">
                            <h2 class="card-title">Ranked SoloQ Stats</h2>
                            <p class="card-subtitle">Win rates, pick rates, synergies & more</p>
                        </div>
                    </div>
                </section>
            </a>

            <a th:href="@{/draft-predict/main}" class="card-link main-card-link">
                <section class="stats-card main-card" id="draftCard">
                    <div class="card-header">
                        <div class="card-icon draft-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 12l2 2 4-4"/>
                                <circle cx="12" cy="12" r="10"/>
                            </svg>
                        </div>
                        <div class="card-title-group">
                            <h2 class="card-title">Draft Predict</h2>
                            <p class="card-subtitle">Draft predict system. Based on soloq stats</p>
                        </div>
                    </div>
                </section>
            </a>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-line"></div>
            <p class="footer-text">
                Statistics collected from
                <span class="games-count" id="totalGames" th:text="${amountOfMatches}">none</span>
                ranked games
            </p>
            <p class="footer-meta">
                Patch <span th:text="${actualPatch}">none</span>
                • Servers (<span th:text="${servers}">EUW, EUNE, KR, NA</span>)
                • Updated <span th:text="${timeUpdated}">none</span>
                • Ranks (<span th:text="${tiers}">Master, Grandmaster, Challenger</span>)
            </p>
        </div>
    </footer>
</div>
</body>
</html>
