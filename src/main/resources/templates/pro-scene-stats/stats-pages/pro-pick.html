<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>

    <!--    Meta-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--    Title-->
    <title>Pro Pick Rates | Draft Predict</title>

    <!--    CSS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/ranked-soloq/stats-pages/detail-page.css">
    <link rel="stylesheet" href="/CSS/pro-scene/stats-pages/pro-pick.css">

    <!--    Logo-->
    <link rel="icon" href="/IMG/logo/riot-logo.png">

</head>
<body>
<div class="bg-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="page-wrapper">
    <header class="site-header">
        <a th:href="@{/pro-scene/main}" class="logo" aria-label="Go to homepage">
            <div class="logo-mark">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 2L4 9v14l12 7 12-7V9L16 2z" stroke="currentColor" stroke-width="2"
                          stroke-linejoin="round"/>
                    <path d="M16 11v10M11 13.5l5-2.5 5 2.5M11 18.5l5 2.5 5-2.5" stroke="currentColor" stroke-width="1.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="logo-text">Draft Predict</span>
            <span class="logo-subtext">(Go to Previous Page)</span>
        </a>
    </header>

    <main class="dashboard detail-dashboard">
        <section class="stats-card detail-card" id="proPickCard">
            <div class="card-header">
                <div class="card-icon pick-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 4h4v4M20 4L9 15M9 15l-4 4M9 15l4 4"/>
                    </svg>
                </div>
                <div class="card-title-group">
                    <h2 class="card-title">Pro Pick Rates</h2>
                    <p class="card-subtitle">Most picked champions on pro scene</p>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="stats-table">
                    <thead>
                    <tr>
                        <th class="col-rank">#</th>
                        <th class="col-champ">Champion</th>
                        <th class="col-position">Position</th>
                        <th class="col-count">Picks</th>
                    </tr>
                    </thead>

                    <tbody id="proPickTableBody">
                    <tr th:each="champ, iterStat : ${proPickRateChampions}" th:style="'animation-delay: ' + ${iterStat.index * 0.06} + 's'">
                        <td class="col-rank" th:text="${iterStat.index + 1}">1</td>
                        <td class="col-champ">
                            <div class="champ-cell">
                                <div class="champ-avatar">
                                    <img th:src="@{'/IMG/champions/logo/' + ${champ.champion} + '.png'}"
                                         th:alt="${champ.champion}" />
                                </div>
                                <span class="champ-name" th:text="${champ.champion}">Champion</span>
                            </div>
                        </td>
                        <td class="col-position">
                            <span class="position-badge" th:text="${champ.position}">Role</span>
                        </td>
                        <td class="col-count">
                            <span class="count-badge" th:text="${champ.count}">0</span>
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-line"></div>
            <p class="footer-text">
                Statistics collected from
                <span class="games-count" id="totalGames" th:text="${amountOfProMatches}">none</span>
                professional matches
            </p>
        </div>
    </footer>
</div>
</body>
</html>
