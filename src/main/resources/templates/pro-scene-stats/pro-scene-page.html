<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>

    <!--    Meta-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--    Title-->
    <title>Pro Scene Stats | Draft Predict</title>

    <!--    CSS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/pro-scene/pro-scene.css">

    <!--    Logo-->
    <link rel="icon" href="/IMG/logo/riot-logo.png">

</head>
<body>
<div class="bg-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="page-wrapper">

    <!--    Navigation panel-->
    <header class="site-header">
        <a th:href="@{/lol/main}" class="logo" aria-label="Go to homepage">
            <div class="logo-mark">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 2L4 9v14l12 7 12-7V9L16 2z" stroke="currentColor" stroke-width="2"
                          stroke-linejoin="round"/>
                    <path d="M16 11v10M11 13.5l5-2.5 5 2.5M11 18.5l5 2.5 5-2.5" stroke="currentColor" stroke-width="1.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="logo-text">Draft Predict</span>
            <span class="logo-subtext">(Go to Previous Page)</span>
        </a>
    </header>

    <!-- Main Dashboard -->
    <main class="pro-scene-main">
        <div class="stats-grid">
            <a th:href="@{/pro-scene/pick-rate}" class="card-link">
                <section class="stats-card" id="proPickRateCard">
                    <div class="card-header">
                        <div class="card-icon pick-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 4h4v4M20 4L9 15M9 15l-4 4M9 15l4 4"/>
                            </svg>
                        </div>
                        <div class="card-title-group">
                            <h2 class="card-title">Pick Rates</h2>
                            <p class="card-subtitle">Most picked champions</p>
                        </div>
                    </div>
                </section>
            </a>
        </div>
    </main>

    <!-- Footer: Pro Matches count -->
    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-line"></div>
            <p class="footer-text">
                Statistics collected from
                <span class="games-count" id="totalGames" th:text="${amountOfProMatches}">none</span>
                professional matches
            </p>
        </div>
    </footer>
</div>
</body>
</html>
