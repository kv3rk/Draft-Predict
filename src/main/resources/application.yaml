spring:
  application:
    name: draft-predict
  profiles:
    active: dev
  main:
    banner-mode: off
    allow-circular-references: off
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
api:
  key: ${API_KEY}
  google_drive:
    key: ${API_GOOGLE_DRIVE_KEY}
    destination_folder_id: ${API_GOOGLE_DRIVE_DESTINATION_FOLDER_ID}
    refresh_token: ${API_GOOGLE_DRIVE_REFRESH_TOKEN}
    client_id: ${API_GOOGLE_DRIVE_CLIENT_ID}
    client_secret: ${API_GOOGLE_DRIVE_CLIENT_SECRET}
  request:
    delay: ${API_REQUEST_DELAY}
  queue:
    id: ${API_QUEUE_ID}
  patch: ${API_PATCH}